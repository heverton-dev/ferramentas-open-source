version: '3.8'

services:
  nocodb_app:
    image: nocodb:latest
    networks:
      - network_conexao
    volumes:
      - nocodb_data:/data
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.nocodb.rule=Host(`nocodb.vpsconexao.org`)"
        - "traefik.http.routers.nocodb.entrypoints=websecure"
        - "traefik.http.routers.nocodb.tls=true"
        - "traefik.http.routers.nocodb.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.nocodb.loadbalancer.server.port=3000"
        - "traefik.http.services.nocodb.loadbalancer.passHostHeader=true"
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

networks:
  network_conexao:
    external: true

volumes:
  nocodb_data:
