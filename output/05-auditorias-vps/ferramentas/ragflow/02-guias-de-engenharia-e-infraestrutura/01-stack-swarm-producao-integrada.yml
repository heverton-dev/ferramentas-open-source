version: '3.8'

services:
  ragflow_app:
    image: ragflow:latest
    networks:
      - network_conexao
    volumes:
      - ragflow_data:/data
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.ragflow.rule=Host(`rag.vpsconexao.org`)"
        - "traefik.http.routers.ragflow.entrypoints=websecure"
        - "traefik.http.routers.ragflow.tls=true"
        - "traefik.http.routers.ragflow.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ragflow.loadbalancer.server.port=80"
        - "traefik.http.services.ragflow.loadbalancer.passHostHeader=true"
      resources:
        limits:
          cpus: '2.0'
          memory: 3072M

networks:
  network_conexao:
    external: true

volumes:
  ragflow_data:
