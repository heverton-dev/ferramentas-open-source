version: '3.8'

services:
  podcastfy_app:
    image: podcastfy:latest
    networks:
      - network_conexao
    volumes:
      - podcastfy_data:/data
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.podcastfy.rule=Host(`audio.vpsconexao.org`)"
        - "traefik.http.routers.podcastfy.entrypoints=websecure"
        - "traefik.http.routers.podcastfy.tls=true"
        - "traefik.http.routers.podcastfy.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.podcastfy.loadbalancer.server.port=80"
        - "traefik.http.services.podcastfy.loadbalancer.passHostHeader=true"
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

networks:
  network_conexao:
    external: true

volumes:
  podcastfy_data:
