version: '3.8'

services:
  seafile_app:
    image: seafile:latest
    networks:
      - network_conexao
    volumes:
      - seafile_data:/data
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.seafile.rule=Host(`drive.vpsconexao.org`)"
        - "traefik.http.routers.seafile.entrypoints=websecure"
        - "traefik.http.routers.seafile.tls=true"
        - "traefik.http.routers.seafile.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.seafile.loadbalancer.server.port=80"
        - "traefik.http.services.seafile.loadbalancer.passHostHeader=true"
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

networks:
  network_conexao:
    external: true

volumes:
  seafile_data:
