version: '3.8'

services:
  ecos-crm-marketing_app:
    image: ecos-crm-marketing:latest
    networks:
      - network_conexao
    volumes:
      - ecos-crm-marketing_data:/data
    deploy:
      mode: replicated
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_conexao"
        - "traefik.http.routers.ecos-crm-marketing.rule=Host(`chat.vpsconexao.org`)"
        - "traefik.http.routers.ecos-crm-marketing.entrypoints=websecure"
        - "traefik.http.routers.ecos-crm-marketing.tls=true"
        - "traefik.http.routers.ecos-crm-marketing.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.ecos-crm-marketing.loadbalancer.server.port=80"
        - "traefik.http.services.ecos-crm-marketing.loadbalancer.passHostHeader=true"
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

networks:
  network_conexao:
    external: true

volumes:
  ecos-crm-marketing_data:
