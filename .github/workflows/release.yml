name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Nunca publicar release de um commit que nao passa na validacao:
      # um submodule quebrado se propaga para todos os projetos consumidores.
      - name: Validar antes de publicar
        run: |
          python tests/test-syntax.py
          bash tests/test-integration.sh

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Fabrica Universal $TAG" \
            --generate-notes
